<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" role="img" aria-label="Certiport Authorized Testing Center">
  <defs>
    <clipPath id="badge">
      <path d="M18 0 H320 V132 Q320 150 302 150 H0 V18 Q0 0 18 0 Z"/>
    </clipPath>
  </defs>
  <path d="M18 0 H320 V132 Q320 150 302 150 H0 V18 Q0 0 18 0 Z" fill="#ffffff"/>
  <g clip-path="url(#badge)">
    <!-- top white area content -->
    <g transform="translate(28,22)">
      <!-- CERTIPORT wordmark with person-as-i -->
      <text x="0" y="34" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#00738C" letter-spacing="1.5">CERT</text>
      <!-- person icon replacing I -->
      <g transform="translate(98,0)">
        <circle cx="14" cy="8" r="5" fill="#00738C"/>
        <path d="M14 14 V36" stroke="#00738C" stroke-width="6" stroke-linecap="round"/>
        <path d="M4 18 L14 10 L24 18" fill="none" stroke="#F9D616" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="128" y="34" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#00738C" letter-spacing="1.5">PORT</text>
      <text x="252" y="12" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#00738C">®</text>
      <line x1="0" y1="46" x2="264" y2="46" stroke="#9aa0a6" stroke-width="1.5"/>
      <text x="0" y="64" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#111" letter-spacing="1.8">A PEARSON VUE BUSINESS</text>
    </g>
    <!-- bottom teal bar -->
    <rect x="0" y="100" width="320" height="50" fill="#00738C"/>
    <text x="160" y="131" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="1.2">AUTHORIZED TESTING CENTER</text>
  </g>
</svg>
